[package]
name = "ag"
version = "1.0.0"
authors = ["Kamil Bicz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
gnuplot = "0.0.44"
libm = "0.2.2"
indicatif = "0.17.3"
polyfit-rs = "0.2.0"
ansi_term = "0.12.1"

[[bin]]
name = "nprofilefitter"
path = "src/main.rs"

[profile.release]
lto = "thin"
opt-level = 3
